<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación del Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <nav class="sidebar">
            <h2>Laboratorios</h2>
            <button onclick="loadLabContent('lab1.md')">Lab 1</button>
            <button onclick="loadLabContent('lab2.md')">Lab 2</button>
            <button onclick="loadLabContent('lab3.md')">Lab 3</button>
            <button onclick="loadLabContent('lab4.md')">Lab 4</button>
        </nav>

        <main class="content" id="content-area">
            <h1>Bienvenido</h1>
            <p>Selecciona un laboratorio del menú de la izquierda para ver la guía.</p>
        </main>
    </div>

    <div id="start-lab-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button" onclick="closeStartLabModal()">&times;</span>
            <h2>Iniciar Laboratorio</h2>
            <p>Por favor, ingresa tus datos para comenzar.</p>
            <form id="lab-form">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>
                
                <button type="submit" class="submit-button">Registrar y Empezar</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="script.js"></script>

</body>
</html>
